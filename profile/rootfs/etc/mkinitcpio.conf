# Amba Linux ARM64 UEFI initramfs.
# No autodetect: the image should not depend on the build machine's storage.
# The virtio drivers are listed explicitly so the image also boots on QEMU
# 'virt' and on ARM boards that expose virtio-mmio, even though the block hook
# already pulls in the storage side.
MODULES=(virtio_pci virtio_blk virtio_scsi virtio_net virtio_gpu)
BINARIES=()
FILES=()
HOOKS=(base udev modconf kms keyboard keymap consolefont block filesystems fsck)
# zstd decompresses faster than gzip on ARM64 and compresses much faster, so
# kernel upgrades and boots are shorter. -T0 uses all cores while building.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0)
