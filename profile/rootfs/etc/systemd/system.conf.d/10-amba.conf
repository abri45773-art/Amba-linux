# Amba Linux: fail fast instead of hanging boot/shutdown.
# The upstream defaults (90s start / 90s stop) make a single stuck unit stall
# the whole boot for minutes on slow ARM storage. 20s/10s still leaves room
# for slow services (e.g. first-boot pacman keyring work) without masking
# real failures for long.
[Manager]
DefaultTimeoutStartSec=20s
DefaultTimeoutStopSec=10s
DefaultDeviceTimeoutSec=10s
