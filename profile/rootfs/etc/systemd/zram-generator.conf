# Amba Linux: compressed RAM swap instead of disk swap.
# Arch Linux ARM boards often ship 2-8 GiB RAM and slow eMMC/SD storage, where
# swapping to disk stalls the whole desktop. zram keeps swap in RAM and gains
# roughly 2-3x capacity for text-heavy pages.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
