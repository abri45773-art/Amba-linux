# Amba Linux: lower-latency network queueing and congestion control.
# fq + BBR keep latency low on Wi-Fi/Ethernet without tuning and avoid the
# buffer-bloat behaviour of the default cubic + fq_codel pairing.
# The modules are loaded by /etc/modules-load.d/amba-network.conf.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
# Amba Linux: reuse TIME_WAIT sockets for new outgoing connections (safe on
# Linux because timestamps are used), and larger listen backlogs so local dev
# servers are not dropped under bursty reconnects.
net.ipv4.tcp_tw_reuse = 1
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
