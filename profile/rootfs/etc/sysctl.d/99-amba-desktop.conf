# Amba Linux: desktop file-watching limits.
# The kernel default (8192 watches) is exhausted by Plasma indexing, KDevelop,
# VS Code and similar tools, which then fail with "too many open files".
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Amba Linux: desktop responsiveness and open-file headroom.
# sched_autogroup groups per terminal/session CPU scheduling so a compiling
# or indexing job in one window does not starve the interactive desktop.
# The default fs.file-max (~1/10 of RAM-derived limit) is hit by Plasma +
# browser combos on small-RAM boards; 2M handles covers heavy desktop use.
# nmi_watchdog=0 frees a PMU/perf counter (the soft lockup watchdog is already
# off via the kernel cmdline "nowatchdog").
kernel.sched_autogroup_enabled = 1
fs.file-max = 2097152
kernel.nmi_watchdog = 0
