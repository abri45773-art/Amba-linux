# Amba Linux: network and kernel hardening for a desktop.
# Deliberately separate from the performance drop-ins: these settings protect
# the desktop from off-path and on-path attack without disturbing routing,
# VPN or normal Wi-Fi use. See docs/SECURITY.md.

# --- Network: strict inbound posture, sane outbound default.
# Loose rp_filter (2): a desktop may use VPNs/multi-interface LAN; strict
# mode (1) would break legitimate asymmetric routing. Spoofed packets are
# still dropped. Use 1 when the desktop is only one interface on a flat LAN.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# A desktop must not accept redirects, sourced routes, or forward traffic.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.ip_forward = 0
# Log martian packets (impossible src/dst) instead of silently ignoring them.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
# IPv6: do not accept router/redirect messages; autoconfiguration
# (SLAAC) still works, only hostile redirect attacks are blocked.
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# --- Kernel: reduce what is readable by unprivileged processes.
# dmesg: only root can read kernel messages (they leak addresses and timing).
kernel.dmesg_restrict = 1
# kptr_restrict: 1 hides kernel pointers from /proc/kallsyms to unprivileged users.
kernel.kptr_restrict = 1
# suid_dumpable: do not let SUID programs dump themselves (would leak data).
fs.suid_dumpable = 0
# Protect symlink/hardlink/fifo writes in world-writable directories.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
# Do not allow mmap below 64 KiB; blocks legacy 32-bit ASLR loopholes.
vm.mmap_min_addr = 65536
