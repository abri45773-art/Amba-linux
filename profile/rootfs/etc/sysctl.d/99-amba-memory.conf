# Amba Linux: memory and swap behaviour for a zram-backed desktop.
# swappiness is raised because moving a page into zram is cheaper than dropping
# filesystem cache. page-cluster=0 avoids reading 8 pages per swap-in, which is
# wasteful for compressed RAM where each page is a separate decompression.
vm.swappiness = 180
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
# Amba Linux: longer writeback intervals batch writes into fewer, larger
# flushes, which reduces flash wear and I/O jitter on eMMC/SD storage.
# Pages can still leave RAM early via zram swap, so this does not increase
# OOM risk.
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500
# Plasma, browsers and DXVK/Vulkan apps can exhaust the default 65530 mappings.
vm.max_map_count = 1048576
